---
# =========================================================
# MetaForge Ansible Configuration Playbook
# Local WSL / Minikube Demo Environment
# =========================================================

- name: Configure MetaForge Runtime Environment
  hosts: k8s_nodes
  gather_facts: yes
  become: no

  vars:
    app_dir: "{{ ansible_env.HOME }}/metaforge"

  tasks:

    - name: 1. Verify Ansible execution
      debug:
        msg:
          - "Ansible is running successfully"
          - "Host: {{ inventory_hostname }}"
          - "User: {{ ansible_user_id }}"
          - "OS: {{ ansible_distribution }}"

    - name: 2. Create MetaForge application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: 3. Verify Docker CLI
      command: docker info
      register: docker_info
      changed_when: false
      failed_when: false

    - name: 4. Verify Docker runtime
      debug:
        msg: >-
          Docker runtime check completed.
          Docker available: {{ 'YES' if docker_info.rc == 0 else 'NO' }}

    - name: 5. Configure MetaForge demo environment
      copy:
        dest: "{{ app_dir }}/environment.conf"
        content: |
          DEMO_MODE=true
          APPLICATION=metaforge
          ENVIRONMENT=production
        mode: '0644'

    - name: 6. Verify Kubernetes CLI
      command: kubectl version --client
      register: kubectl_version
      changed_when: false
      failed_when: false

    - name: 7. Verify Minikube
      command: minikube status
      register: minikube_status
      changed_when: false
      failed_when: false

    - name: 8. Print Ansible deployment summary
      debug:
        msg:
          - "=========================================="
          - "METAFORGE ANSIBLE CONFIGURATION COMPLETE"
          - "=========================================="
          - "Host: {{ inventory_hostname }}"
          - "Docker: {{ 'AVAILABLE' if docker_info.rc == 0 else 'UNAVAILABLE' }}"
          - "kubectl: {{ 'AVAILABLE' if kubectl_version.rc == 0 else 'UNAVAILABLE' }}"
          - "Minikube: {{ 'AVAILABLE' if minikube_status.rc == 0 else 'UNAVAILABLE' }}"
          - "Application directory: {{ app_dir }}"
          - "DEMO_MODE: true"